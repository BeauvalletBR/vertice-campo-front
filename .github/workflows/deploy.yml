name: Deploy Vertice Campo Front

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: vertice-campo-front-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build e Deploy Frontend

    runs-on:
      - self-hosted
      - linux
      - x64
      - vertice-front

    timeout-minutes: 20

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Usar ENV de producao
        run: |
          cp /srv/apps/vertice-campo-front/.env .env

      - name: Mostrar versoes
        run: |
          node --version
          npm --version

      - name: Instalar dependencias
        run: |
          npm ci

      - name: Gerar build
        run: |
          npm run build

      - name: Publicar frontend
        run: |
          target=/srv/apps/vertice-campo-front/dist
          mkdir -p "$target/assets"

          # Assets primeiro e index por ultimo evitam uma versao apontar para arquivos ainda nao copiados.
          cp -a dist/assets/. "$target/assets/"
          find dist -mindepth 1 -maxdepth 1 ! -name assets ! -name index.html -exec cp -a {} "$target/" \;
          cp dist/index.html "$target/index.html"

          # Mantem chunks antigos para abas abertas durante novos deploys.
          find "$target/assets" -type f -mtime +30 -delete

      - name: Testar frontend
        run: |
          sleep 2
          curl -fsS http://127.0.0.1:4176/ > /dev/null
          echo "Vertice Campo Front publicado com sucesso"
